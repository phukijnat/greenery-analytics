<svg width="900" height="410" viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#aac8e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#f5c518" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="grad-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#0d2f60"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5080"/>
      <stop offset="100%" stop-color="#0f3560"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5470"/>
      <stop offset="100%" stop-color="#0e3a52"/>
    </linearGradient>
  </defs>

  <!-- content total width = 680px, canvas = 900px, offset = (900-680)/2 = 110 -->
  <g transform="translate(110, 0)">

    <!-- Outer dashed red border: x=12 y=12 w=656 h=308 -->
    <rect x="12" y="12" width="656" height="308" rx="16" fill="none" stroke="#e85555" stroke-width="2" stroke-dasharray="10 5"/>

    <!-- SOURCE SYSTEMS -->
    <rect x="28" y="32" width="120" height="268" rx="14" fill="url(#grad-source)"/>
    <text x="88" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="white">Source</text>
    <text x="88" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="white">Systems</text>
    <text x="88" y="200" text-anchor="middle" font-size="12" fill="#a0c0e8">Database</text>
    <text x="88" y="218" text-anchor="middle" font-size="12" fill="#a0c0e8">APIs · · ·</text>

    <!-- Arrow Source → Data Lake -->
    <line x1="149" y1="166" x2="174" y2="166" stroke="#aac8e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- DATA LAKE -->
    <rect x="178" y="32" width="220" height="138" rx="14" fill="url(#grad-card)"/>
    <text x="288" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="white">Data Lake</text>
    <text x="288" y="118" text-anchor="middle" font-size="13" fill="#a0c0e8">Google Cloud Storage</text>

    <!-- DATA PROCESSING -->
    <rect x="178" y="192" width="220" height="108" rx="14" fill="url(#grad-teal)"/>
    <text x="288" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="white">Data Processing</text>
    <text x="288" y="270" text-anchor="middle" font-size="13" fill="#a0c0e8">Apache Spark</text>

    <!-- Yellow dashed arrows: Data Lake ↔ Data Processing -->
    <path d="M 230 170 C 216 180 216 192 230 202" fill="none" stroke="#f5c518" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-yellow)"/>
    <path d="M 346 202 C 360 192 360 180 346 170" fill="none" stroke="#f5c518" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-yellow)"/>

    <!-- Arrow Data Lake → Data Warehouse -->
    <line x1="399" y1="101" x2="424" y2="101" stroke="#aac8e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- DATA WAREHOUSE -->
    <rect x="428" y="32" width="220" height="138" rx="14" fill="url(#grad-card)"/>
    <text x="538" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="white">Data Warehouse</text>
    <text x="538" y="118" text-anchor="middle" font-size="13" fill="#a0c0e8">Google BigQuery</text>

    <!-- ANALYTICS -->
    <rect x="428" y="192" width="220" height="108" rx="14" fill="url(#grad-teal)"/>
    <text x="538" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="white">Analytics</text>
    <text x="538" y="270" text-anchor="middle" font-size="13" fill="#a0c0e8">dbt</text>

    <!-- Yellow dashed arrows: Data Warehouse ↔ Analytics -->
    <path d="M 480 170 C 466 180 466 192 480 202" fill="none" stroke="#f5c518" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-yellow)"/>
    <path d="M 596 202 C 610 192 610 180 596 170" fill="none" stroke="#f5c518" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-yellow)"/>



    <!-- WORKFLOW ORCHESTRATOR: centered under border (border center x = 12+328 = 340) -->
    <rect x="225" y="342" width="230" height="52" rx="16" fill="none" stroke="#e07030" stroke-width="2"/>
    <text x="340" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#4ab8c8">Workflow Orchestrator</text>
    <text x="340" y="382" text-anchor="middle" font-size="12" fill="#a0c0e8">Apache Airflow</text>

  </g>
</svg>
